<svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 2732 2732" role="img" aria-label="Reflejo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20264a"/>
      <stop offset="0.55" stop-color="#161a34"/>
      <stop offset="1" stop-color="#101226"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffe6c2"/>
      <stop offset="0.45" stop-color="#f4c78f"/>
      <stop offset="1" stop-color="#d99a53"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0be86" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f0be86" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="2732" height="2732" fill="url(#bg)"/>

  <!-- logo centrado, dentro de la zona segura -->
  <g transform="translate(1366,1120)">
    <circle cx="0" cy="0" r="380" fill="url(#glow)"/>
    <circle cx="0" cy="0" r="196" fill="url(#orb)"/>
    <circle cx="-66" cy="-62" r="66" fill="#fff3e2" opacity="0.55"/>
    <ellipse cx="0" cy="256" rx="196" ry="58" fill="#f0be86" opacity="0.36"/>
    <ellipse cx="0" cy="350" rx="146" ry="38" fill="#f0be86" opacity="0.20"/>
    <ellipse cx="0" cy="422" rx="100" ry="24" fill="#f0be86" opacity="0.11"/>
  </g>

  <text x="1366" y="1820" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="200"
        font-weight="500" fill="#fbfaff" letter-spacing="4">Reflejo</text>
</svg>
